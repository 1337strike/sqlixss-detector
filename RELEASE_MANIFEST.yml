# Release Manifest — v1.1.0
# ICITDA 2026 Camera-ready / GitHub release
# Generated: 2026-09-25

release:
  version:    "1.1.0"
  tag:        "v1.1.0"
  paper:      "ICITDA 2026 — Evaluating Input Canonicalization for SQLi and XSS Detection Using Lightweight Machine Learning"
  timestamp:  "2026-09-25T00:00:00Z"

## reproducibility

corpus:
  source:     "https://github.com/InfoSecWarrior/Offensive-Payloads"
  upstream_commit: "9e67029a4fa4bfd6a2776f99d2df9c1e660abcab"   # sha256 per file in data/raw/provenance.json
  sqli:       307          # unique payloads after de-duplication
  xss:        135
  benign:     570          # generated from parameterized templates
  total:      1012
  families:   815
  download_script: "scripts/00_download_payloads.py"

split:
  method:     "stratified group k-fold"
  k:          5
  seed:       42
  family_key: "digit→N, quoted→'S', whitespace collapsed, lowercase"
  script:     "scripts/01c_build_grouped_dataset.py"
  leakage_check: "tests/test_split_integrity.py"

experiment:
  protocol:   "5-fold × 3 repeats = 15 fits per configuration"
  script:     "scripts/definitive_experiment.py --seed 42 --folds 5 --repeats 3"
  results:    "results/definitive_20260923T094339Z_42/"
  statistics: "Nadeau-Bengio corrected paired t-test + Holm correction (src/statistics.py)"
  # scripts/08_final_experiment.py is superseded: it double-canonicalized
  # signature_normalized inputs (AUDIT_REPORT.md, Bug B1).

## key results (Table I, paper — from results/definitive_20260923T094339Z_42/)

canonicalization_effect:
  logistic_regression:
    raw_f1_obf:        0.7905
    normalized_f1_obf: 0.9934
    improvement:       0.2029
    p_holm:            3.42e-07
  svm:
    raw_f1_obf:        0.8592
    normalized_f1_obf: 0.9919
    improvement:       0.1327
    p_holm:            1.30e-05
  naive_bayes:
    raw_f1_obf:        0.8121
    normalized_f1_obf: 0.9838
    improvement:       0.1717
    p_holm:            1.65e-06
  signature_baseline:
    raw_f1_obf:        0.5893
    normalized_f1_obf: 0.8420
    improvement:       0.2527
    p_holm:            1.65e-06

## environment

environment:
  lockfile:    "requirements.lock"   # reproduces the reference run bit-for-bit
  python:      "3.12.3"
  sklearn:     "1.8.0"
  scipy:       "1.17.1"
  numpy:       "2.4.4"
  os:          "Linux x86-64"
  seed:        42

## known limitations

limitations:
  - "Benign samples are template-generated, not from production traffic"
  - "Corpus from a single source (InfoSecWarrior) — no independent holdout"
  - "Semantic oracle (validate_semantics.py) uses static SQLite, not a browser runtime for XSS"
  - "Encoding-family overlap (%n) between training and obfuscated test — documented in tests/test_split_integrity.py"
  - "Adaptive payloads (crafted to survive canonicalization) not evaluated"

## files

key_files:
  - src/baseline_normalized.py    # canonicalization pipeline
  - src/statistics.py             # Holm correction, CI utilities
  - scripts/00_download_payloads.py
  - scripts/01c_build_grouped_dataset.py
  - scripts/07_per_technique_analysis.py
  - scripts/definitive_experiment.py
  - scripts/validate_semantics.py
  - tests/test_pipeline_regression.py
  - tests/test_split_integrity.py
  - tests/integration/test_end_to_end.py
  - requirements.lock
  - .github/workflows/ci.yml
