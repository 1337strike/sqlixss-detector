name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Reproducibility
    runs-on: ubuntu-latest

    # Redis for the live multi-worker proxy test (shared ban state);
    # REQUIRE_REDIS makes that test fail instead of skip if Redis is missing.
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      REQUIRE_REDIS: "1"
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned paper environment
        run: pip install -r requirements.lock

      - name: Download corpus (pinned upstream commit, SHA-256 verified)
        run: python scripts/00_download_payloads.py

      - name: Build grouped dataset
        run: python scripts/01c_build_grouped_dataset.py

      - name: Corpus and split identical to committed paper data
        run: git diff --exit-code -- data/raw/*.txt data/processed/

      - name: Split integrity tests
        run: python -m pytest tests/test_split_integrity.py -v

      - name: Train models
        run: python scripts/02_train_models.py

      - name: Pipeline regression tests (G1/M2)
        run: python -m pytest tests/test_pipeline_regression.py -v

      - name: Integration tests (G2)
        run: python -m pytest tests/integration/test_end_to_end.py -v

      - name: Semantic validation smoke test (D3)
        run: python scripts/validate_semantics.py --label sqli

      - name: Offline evaluation
        run: python scripts/03_evaluate_offline.py

      - name: Definitive experiment (all paper tables)
        run: python scripts/definitive_experiment.py --seed 42 --folds 5 --repeats 3

      - name: Bit-exact reproduction of the paper's reference run (data + statistics)
        run: python scripts/verify_reference_run.py

      - name: WAF deployment tests (in-process HTTP)
        run: python -m pytest tests/integration/test_waf_deployment.py -v

      - name: Live proxy tests (real processes; gunicorn + Redis)
        run: python -m pytest tests/integration/test_proxy_live.py -v

      - name: Download CSIC 2010 (pinned mirror commit, SHA-256 verified)
        run: python scripts/00b_download_csic2010.py

      - name: Rate limiter unit + live tests (both backends; CSIC 2010 normal traffic -> 0 bans)
        run: python -m pytest tests/test_rate_limiter.py tests/integration/test_rate_limiter_live.py -v -p no:logging

      - name: AI-agent defense tests (both backends; live agent scenarios over HTTP)
        run: python -m pytest tests/test_agent_defense.py tests/integration/test_waf_agent_defense.py -v -p no:logging

      - name: All tests summary
        # The ~3-minute CSIC 2010 no-ban replay already ran in the rate-limiter
        # step above; don't run it twice.
        run: |
          set -o pipefail
          python -m pytest tests/ -v --tb=short \
            --deselect tests/integration/test_rate_limiter_live.py::test_csic2010_normal_traffic_triggers_no_bans \
            2>&1 | tail -20
